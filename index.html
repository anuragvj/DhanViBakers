<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DhanVi Bakers</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
    input, button { display: block; width: 100%; padding: 0.6rem; margin: 0.5rem 0; box-sizing: border-box; }
    .error { color: #b00020; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1><b>DhanVi Bakers</b></h1>

  <section id="login-view" class="hidden" style="border: 2px solid black; padding: 15px;">
    <h2>Admin login</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn">Sign in</button>
    <p id="login-error" class="error"></p>
  </section>

  <section id="app-view" class="hidden" style="box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15); padding: 20px;">
    <p>Signed in as <strong id="user-email"></strong></p>
    <button id="logout-btn">Sign out</button>
    <h2>Ingredients</h2>
    <p id="ingredients-status"></p>
    <table id="ingredients-table" border="1" cellpadding="6">
      <thead>
        <tr><th>Name</th><th>Price (₹)</th><th>For quantity</th><th>Unit</th><th>Active</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
